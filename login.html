<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Stats - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #181818;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #282828;
        }

        h1 {
            color: #1db954;
            font-size: 26px;
            margin-bottom: 24px;
        }

        .btn-spotify {
            background-color: #1db954;
            color: #000000;
            font-weight: bold;
            font-size: 15px;
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-spotify:hover {
            background-color: #1ed760;
            transform: scale(1.02);
        }

        .divider {
            margin: 20px 0;
            color: #b3b3b3;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #282828;
            border: 1px solid #3e3e3e;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #1db954;
        }

        .btn-submit {
            background-color: #1db954;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
            font-size: 15px;
        }

        .btn-submit:hover {
            background-color: #1ed760;
        }

        .register-link {
            margin-top: 15px;
            font-size: 13px;
            color: #b3b3b3;
        }

        .register-link a {
            color: #1db954;
            text-decoration: none;
        }

        .btn-guest {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-guest:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Spotify Stats Pro</h1>

        <button id="btn-wrapped" class="btn-spotify">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-.1.2-1.2-.42-.18-.6.18-1.2.78-1.38 4.26-1.26 11.28-1.02 15.72 1.62.539.3 1.02.3 1.02-.3.18-.6-.3-1.08-.84-1.38z"/>
            </svg>
            Generar mi Spotify Wrapped
        </button>

        <div class="divider">— O usa tu cuenta local —</div>

        <form id="login-form">
            <div class="form-group">
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-submit">Entrar al Dashboard</button>
        </form>

        <p class="register-link">¿No tienes cuenta? <a href="#" id="link-register">Regístrate aquí</a></p>

        <button id="btn-guest" class="btn-guest">Probar en Modo Invitado 👁</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnWrapped = document.getElementById('btn-wrapped');
            const loginForm = document.getElementById('login-form');
            const btnGuest = document.getElementById('btn-guest');

            // 1. Entrar con Spotify Wrapped
            btnWrapped.addEventListener('click', () => {
                window.location.href = 'http://127.0.0.1:5000/api/auth/spotify/login';
            });

            // 2. Entrar con Cuenta Local -> Redirige al Dashboard
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                window.location.href = 'index.html';
            });

            // 3. Entrar en Modo Invitado -> Redirige al Dashboard
            btnGuest.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
